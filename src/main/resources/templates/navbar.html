<!-- navbar.html -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/about">ToDoList</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>


    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <!-- Enlace a Tareas (solo si está loguea do y usuarioId no es null) -->
        <li th:if="${isLoggedIn and usuarioId != null}" class="nav-item">
          <a class="nav-link" th:href="@{/usuarios/{id}/tareas(id=${usuarioId})}">Tareas</a>
        </li>
        <li>
          <a class="nav-link" th:href="@{/registrados}">Usuarios</a>
        </li>
        <li th:if="${isLoggedIn and usuarioId != null}" class="nav-item">
          <a class="nav-link" th:href="@{/equipos}">Equipos</a>
        </li>

        <!-- Si el usuario está logueado: Dropdown con nombre -->
        <li th:if="${isLoggedIn}" class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown"
             role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span th:text="${username}">Usuario</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item" href="/account">Cuenta</a></li>
            <li>
              <a class="dropdown-item" th:href="@{/logout}">
                Cerrar sesión <span th:text="${username}"></span>
              </a>
            </li>
          </ul>
        </li>

        <!-- Si el usuario NO está logueado: Login y Registro -->
        <li th:if="${!isLoggedIn}" class="nav-item">
          <a class="nav-link" href="/login">Login</a>
        </li>
        <li th:if="${!isLoggedIn}" class="nav-item">
          <a class="nav-link" href="/registro">Registro</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
