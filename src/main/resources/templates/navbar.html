<!-- Custom Navbar Styles -->
<style>
  .navbar-custom {
    backdrop-filter: blur(12px);
    transition: background-color 0.3s, border-color 0.3s;
    padding-top: 1rem;
    padding-bottom: 1rem;
  }

  /* Brand Style */
  .navbar-custom .navbar-brand {
    font-weight: 800;
    font-family: 'Inter', sans-serif;
    letter-spacing: -0.025em;
    font-size: 1.25rem;
  }

  /* Link Styles */
  .navbar-custom .nav-link {
    font-weight: 500;
    font-size: 0.95rem;
    transition: color 0.2s;
  }


  /* DARK MODE (Default/Moon) */
  [data-bs-theme="dark"] .navbar-custom {
    background-color: rgba(15, 23, 42, 0.8);
    /* Slate 900 transparent */
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  [data-bs-theme="dark"] .navbar-custom .navbar-brand {
    color: #f8fafc;
    /* Slate 50 */
  }

  [data-bs-theme="dark"] .navbar-custom .nav-link {
    color: #94a3b8;
    /* Slate 400 */
  }

  [data-bs-theme="dark"] .navbar-custom .nav-link:hover,
  [data-bs-theme="dark"] .navbar-custom .nav-link.active {
    color: #10b981;
    /* Emerald 400 */
  }

  [data-bs-theme="dark"] .dropdown-menu {
    background-color: rgba(30, 41, 59, 0.9);
    /* Slate 800 */
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  [data-bs-theme="dark"] .dropdown-item {
    color: #cbd5e1;
    /* Slate 300 */
  }

  [data-bs-theme="dark"] .dropdown-item:hover {
    background-color: rgba(16, 185, 129, 0.1);
    color: #10b981;
  }

  [data-bs-theme="dark"] .dropdown-divider {
    border-top-color: rgba(255, 255, 255, 0.1);
  }

  [data-bs-theme="dark"] .navbar-toggler-icon {
    filter: invert(1);
    /* Ensure icon is visible on dark */
  }


  /* LIGHT MODE (Sun) */
  [data-bs-theme="light"] .navbar-custom {
    background-color: rgba(255, 255, 255, 0.8);
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
  }

  [data-bs-theme="light"] .navbar-custom .navbar-brand {
    color: #0f172a;
    /* Slate 900 */
  }

  [data-bs-theme="light"] .navbar-custom .nav-link {
    color: #64748b;
    /* Slate 500 */
  }

  [data-bs-theme="light"] .navbar-custom .nav-link:hover,
  [data-bs-theme="light"] .navbar-custom .nav-link.active {
    color: #059669;
    /* Emerald 600 */
  }

  /* Theme Toggle Button Style Override */
  #bd-theme {
    border: none;
    background: transparent;
  }
</style>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"

      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-center">
        <li th:if="${isLoggedIn and usuarioId != null}" class="nav-item dropdown">

            Tareas
          </a>
          <ul class="dropdown-menu" aria-labelledby="navbarDropdownTareas">
            <li>
              <a class="dropdown-item" th:href="@{/usuarios/{id}/tareas(id=${usuarioId})}">Tareas pendientes</a>
            </li>
            <li>
              <a class="dropdown-item" th:href="@{/usuarios/{id}/tareas/completadas(id=${usuarioId})}">Tareas
                completadas</a>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li>
              <a class="dropdown-item" th:href="@{/usuarios/{id}/etiquetas(id=${usuarioId})}">Modificar etiquetas</a>
            </li>
            <li>
              <a class="dropdown-item" th:href="@{/usuarios/{id}/tareas/borradas(id=${usuarioId})}">Papelera</a>
            </li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/registrados}">Usuarios</a>
        </li>
        <li th:if="${isLoggedIn and usuarioId != null}" class="nav-item">
          <a class="nav-link" th:href="@{/equipos}">Equipos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/about}">Acerca de</a>

        <li th:if="${isLoggedIn}" class="nav-item dropdown">

        <li class="nav-item ms-2">
          <button class="btn nav-link" id="bd-theme" type="button" onclick="toggleTheme()" title="Cambiar tema">
            <i id="theme-icon" class="bi bi-circle-half"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<script>
  // Función que se ejecuta al pulsar el botón
  function toggleTheme() {
    // Leemos el tema actual del atributo html
    const currentTheme = document.documentElement.getAttribute('data-bs-theme');
    // Si es oscuro lo pasamos a claro, y viceversa
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

    // Aplicamos el cambio
    document.documentElement.setAttribute('data-bs-theme', newTheme);
    // Guardamos la preferencia en el navegador
    localStorage.setItem('theme', newTheme);

    // Actualizamos el icono
    updateIcon(newTheme);
  }

  function updateIcon(theme) {
    const icon = document.getElementById('theme-icon');
    // Limpiamos clases anteriores
    icon.className = 'bi';

    if (theme === 'dark') {
      icon.classList.add('bi-moon-stars-fill'); // Icono luna
    } else {
      icon.classList.add('bi-sun-fill');        // Icono sol
    }
  }

  // Al cargar la página, asegurarnos que el icono coincida con el tema actual
  document.addEventListener('DOMContentLoaded', () => {
    // Recuperamos el tema que puso el script del head (fragments.html)
    const savedTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
    updateIcon(savedTheme);
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
