<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Listado de Equipos')"></head>

<body>
<div th:replace="~{navbar}"></div>

<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2>Listado de Equipos</h2>
            <p>
                <a class="btn btn-primary" th:href="@{/equipos/nuevo}">Crear nuevo equipo</a>
            </p>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="equipo: ${equipos}">
                    <td th:text="${equipo.id}"></td>
                    <td>
                        <!-- El nombre ahora es un enlace -->
                        <a th:href="@{/equipos/{id}/usuarios(id=${equipo.id})}"
                           th:text="${equipo.nombre}"></a>
                    </td>
                    <td>
                        <a class="btn btn-primary btn-xs"
                           th:href="@{/equipos/{id}/usuarios(id=${equipo.id})}">Ver Usuarios</a>
                        <a class="btn btn-success btn-xs"
                           th:href="@{/equipos/{idEquipo}/usuarios/{idUsuario}/agregar(idEquipo=${equipo.id},idUsuario=${usuario.id})}">Unirse</a>
                        <a class="btn btn-danger btn-xs"
                           th:href="@{/equipos/{idEquipo}/usuarios/{idUsuario}/eliminar(idEquipo=${equipo.id},idUsuario=${usuario.id})}">Eliminar</a>
                        <a class="btn btn-warning btn-xs"
                           th:if="${usuario.admin}"
                           th:href="@{/equipos/{idEquipo}/editar(idEquipo=${equipo.id})}">Editar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
