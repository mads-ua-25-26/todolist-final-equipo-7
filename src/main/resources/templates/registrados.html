<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Usuarios Registrados')"></head>

<body>
<div th:replace="~{navbar}"></div>

<div class="container mt-5">
  <h1 class="mb-4">Usuarios Registrados</h1>

  <div class="card">
    <div class="card-body">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Email</th>
          <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
          <td th:text="${usuario.id}"></td>
          <td th:text="${usuario.email}"></td>
          <td>
            <a th:href="@{/registrados/{id}(id=${usuario.id})}" class="btn btn-sm btn-primary">
              Ver Descripción
            </a>
          </td>
        </tr>
        </tbody>
      </table>

      <div th:if="${#lists.isEmpty(usuarios)}" class="alert alert-info">
        No hay usuarios registrados
      </div>
    </div>
  </div>

  <div class="mt-3">
    <a href="/login" class="btn btn-secondary">Volver al Login</a>
  </div>
</div>
</body>
</html>
