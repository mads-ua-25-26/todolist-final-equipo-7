<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="fragments :: head (titulo='Nueva Tarea')"></th:block>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Base Page Style (Dark Theme Default) */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 30px 30px;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Glassmorphism Card like Login */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            color: white;
        }

        h2,
        h3 {
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        label {
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }

        /* Inputs - Neumorphism/Dark Modern */
        .form-control {
            background-color: #0f172a !important;
            border: 1px solid #334155;
            color: #e2e8f0 !important;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            background-color: #0f172a !important;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            color: white !important;
        }

        .form-control::placeholder {
            color: #64748b;
        }

        /* Buttons */
        .btn-emerald {
            background-color: #10b981;
            color: white;
            border: none;
            font-weight: 600;
            border-radius: 9999px;
            /* Pill shape */
            padding: 10px 24px;
            transition: all 0.2s;
        }

        .btn-emerald:hover {
            background-color: #059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
            color: white;
        }

        .text-emerald {
            color: #10b981;
            font-weight: 600;
        }

        .text-emerald:hover {
            color: #059669;
            text-decoration: underline;
        }

        /* Light Mode Overrides */
        [data-bs-theme="light"] body {
            background-color: #F4F6F9;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            color: #1e293b;
        }

        [data-bs-theme="light"] .glass-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.05);
            color: #1e293b;
        }

        [data-bs-theme="light"] h2,
        [data-bs-theme="light"] h3 {
            background: none;
            -webkit-text-fill-color: initial;
            color: #0f172a;
        }

        [data-bs-theme="light"] label {
            color: #475569;
        }

        [data-bs-theme="light"] .form-control {
            background-color: #ffffff !important;
            border: 1px solid #ced4da;
            color: #495057 !important;
        }

        [data-bs-theme="light"] .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>

<body>

    <div th:replace="~{navbar}"></div>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="glass-card p-5">
                    <h2 class="text-center">Crear Nueva Tarea</h2>
                    <h6 class="text-center text-muted mb-4" th:text="'Para usuario: ' + ${usuario.getNombre()}"></h6>

                    <form method="post" th:action="@{/usuarios/{id}/tareas/nueva(id=${usuario.id})}"
                        th:object="${tareaData}">

                        <div class="form-group mb-4">
                            <label for="titulo">Título</label>
                            <input class="form-control" id="titulo" name="titulo" type="text"
                                placeholder="Ej: Comprar el pan" required th:field="*{titulo}" />
                        </div>

                        <div class="form-group mb-4">
                            <label for="descripcion">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                                placeholder="Detalles adicionales..." th:field="*{descripcion}"></textarea>
                        </div>

                        <div class="form-group mb-4">
                            <label for="fechaFinalizacion">Fecha de Vencimiento</label>
                            <input class="form-control" id="fechaFinalizacion" name="fechaFinalizacion" type="date"
                                th:field="*{fechaFinalizacion}" />
                        </div>

                        <div class="form-group mb-4">
                            <label for="select-etiquetas">Etiquetas</label>
                            <select class="form-control" id="select-etiquetas" onchange="agregarEtiqueta(this)">
                                <option value="" selected disabled>Añadir etiqueta...</option>
                                <option th:each="etiqueta : ${etiquetas}" th:value="${etiqueta.id}"
                                    th:text="${etiqueta.nombre}" th:data-color="${etiqueta.color}">
                                </option>
                            </select>
                        </div>

                        <div id="etiquetas-seleccionadas" class="mb-4"></div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-between align-items-center mt-5">
                            <a class="text-emerald" th:href="@{/usuarios/{id}/tareas(id=${usuario.id})}"
                                style="text-decoration: none;">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                            <button class="btn btn-emerald shadow" type="submit">
                                Crear Tarea
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments::javascript"></div>

    <script>
        const etiquetasSeleccionadas = new Set();

        function agregarEtiqueta(select) {
            const option = select.options[select.selectedIndex];
            const id = option.value;
            const nombre = option.text;
            const color = option.getAttribute('data-color');

            if (!id) return;

            etiquetasSeleccionadas.add(id);

            const container = document.getElementById('etiquetas-seleccionadas');
            const badge = document.createElement('span');
            badge.className = 'badge badge-pill mr-2 mb-2 p-2';
            badge.style.backgroundColor = color;
            badge.style.color = 'white';
            badge.style.cursor = 'pointer';
            badge.style.fontSize = '0.9em';
            badge.innerHTML = `${nombre} &times;`;
            badge.title = "Haz clic para eliminar";

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'etiquetaIds';
            input.value = id;

            badge.onclick = function () {
                container.removeChild(badge);
                etiquetasSeleccionadas.delete(id);
            };

            badge.appendChild(input);
            container.appendChild(badge);
            select.value = "";
        }
    </script>

</body>

</html>
