<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Acerca de')"></head>

<head>
    <!-- Add Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Force Dark Theme Architecture for this page's main container */
        .login-page-wrapper {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            /* Slate 900 */
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 30px 30px;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            color: #f8fafc;
            /* Slate 50 */
            padding-top: 120px;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* Typography */
        h1.page-title {
            font-weight: 800;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2.subtitle {
            font-size: 1.25rem;
            color: #94a3b8;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        h3.section-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        /* Team List */
        .team-list {
            list-style: none;
            padding: 0;
            margin-bottom: 2rem;
        }

        .team-member {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .team-member:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            transform: translateY(-2px);
        }

        /* Footer Info */
        .version-info {
            font-size: 0.875rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.5rem;
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
        }

        /* LIGHT MODE OVERRIDES */
        [data-bs-theme="light"] .login-page-wrapper {
            background-color: #F4F6F9;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            color: #1e293b;
        }

        [data-bs-theme="light"] .glass-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1);
        }

        [data-bs-theme="light"] h2.subtitle {
            color: #64748b;
        }

        [data-bs-theme="light"] h3.section-title {
            color: #94a3b8;
        }

        [data-bs-theme="light"] .team-member {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.05);
            color: #334155;
        }

        [data-bs-theme="light"] .team-member:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #047857;
        }

        [data-bs-theme="light"] .version-info {
            color: #94a3b8;
            border-top-color: rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div th:replace="~{navbar}"></div>

    <div class="login-page-wrapper">
        <!-- Decorative Background Blob -->
        <div
            style="position: absolute; width: 500px; height: 500px; background: rgba(139, 92, 246, 0.15); border-radius: 50%; filter: blur(100px); z-index: -1;">
        </div>

        <div class="glass-card">
            <h1 class="page-title">MADS ToDo</h1>
            <h2 class="subtitle">Organiza tu caos, aprueba tu asignatura.</h2>

            <h3 class="section-title">Equipo de Desarrollo 07</h3>

            <ul class="team-list">
                <li class="team-member">Wesley Murillo Castro</li>
                <li class="team-member">Elena Rocamora Bernabeu</li>
                <li class="team-member">Joan Climent Quiñones</li>
            </ul>

            <div class="version-info">
                <span>Versión 1.4.0</span>
                <span>Release: 15/12/2025</span>
            </div>
        </div>
    </div>

    <div th:replace="fragments::javascript" />
</body>

</html>
