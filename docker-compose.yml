version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: mads-postgres
    environment:
      POSTGRES_DB: mads
      POSTGRES_USER: mads
      POSTGRES_PASSWORD: mads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

volumes:
  postgres_data:

